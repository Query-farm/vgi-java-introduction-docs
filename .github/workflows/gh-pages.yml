name: Redirect the GitHub Pages host to Cloudflare

# The canonical site is https://vgi-java-introduction.query.farm (Cloudflare
# Pages, deployed manually with wrangler — see README / deploy.yml).
#
# This host (https://query-farm.github.io/vgi-java-introduction-docs/) used to be
# the temporary mirror; it now publishes a tiny static redirect shim
# (gh-pages-redirect/) that forwards every path to the matching page on the
# canonical domain, with rel=canonical + noindex so search consolidates there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
