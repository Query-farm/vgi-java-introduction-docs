name: Deploy to Cloudflare Pages

# Builds the VitePress site and deploys it to the `vgi-java-introduction`
# Cloudflare Pages project (https://vgi-java-introduction.query.farm).
#
# Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   — a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — the Query Farm account id
#
# Manual-only for now: GitHub Pages (gh-pages.yml) is the temporary host while the
# Cloudflare Pages project doesn't exist yet. Once it's created and the secrets are
# set, add `push: { branches: [main] }` here to auto-deploy to Cloudflare.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/.vitepress/dist --project-name=vgi-java-introduction --branch=main
